name: ProfiPrompt Qt isolation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [control, live-board, language-switch, accessibility, tier2, full]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt Pillow
      - name: Restore product workflow for static contract checks
        run: git show cf8d5cb15683f4e2295b71c012d41c4ae9feedba:.github/workflows/tests.yml > .github/workflows/tests.yml
      - name: Isolate filter and interpreter finalization
        run: |
          python - <<'PY'
          import os, sys, gc, pytest
          scenario = os.environ['SCENARIO']
          options = {'control': ['-ra', '-q', '--ignore=tests/test_standard_dialog_buttons.py', '--ignore=tests/test_i18n_live_board_transfer_tile_colors_20261006.py', '--ignore=tests/test_language_switch.py', '--ignore=tests/test_ui_accessibility.py', '--ignore=tests/test_i18n_tier2_contract.py'], 'live-board': ['-ra', '-q', 'tests/test_i18n_live_board_transfer_tile_colors_20261006.py'], 'language-switch': ['-ra', '-q', 'tests/test_language_switch.py'], 'accessibility': ['-ra', '-q', 'tests/test_ui_accessibility.py'], 'tier2': ['-ra', '-q', 'tests/test_i18n_tier2_contract.py'], 'full': ['-ra', '-q']}
          class Cleanup:
              def pytest_sessionfinish(self, session, exitstatus):
                  from PySide6 import QtWidgets
                  import shiboken6
                  app = QtWidgets.QApplication.instance()
                  localizer = getattr(app, '_profiprompt_dialog_button_localizer', None)
                  if localizer is not None:
                      app.removeEventFilter(localizer)
                      delattr(app, '_profiprompt_dialog_button_localizer')
                      shiboken6.delete(localizer)
                      print('DIAGNOSTIC_FILTER_REMOVED', flush=True)
                  print('DIAGNOSTIC_GC', gc.collect(), flush=True)
          sys.exit(pytest.main(options[scenario], plugins=[Cleanup()] if scenario == 'cleanup' else []))
          PY
