name: ProfiPrompt Qt version comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
        pyside: ['6.12.0', '6.11.2']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install comparison dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-qt Pillow 'PySide6==${{ matrix.pyside }}'
      - name: Restore product workflow for static contract checks
        run: git show cf8d5cb15683f4e2295b71c012d41c4ae9feedba:.github/workflows/tests.yml > .github/workflows/tests.yml
      - name: Probe None ownership around wrapped calls
        run: |
          python - <<'PY'
          import gc, sys, json, PySide6
          from PySide6 import QtWidgets
          app = QtWidgets.QApplication([])
          widget = QtWidgets.QWidget()
          operations = [('python_none_control', lambda: None), ('setWindowTitle', lambda: widget.setWindowTitle('ownership probe')), ('processEvents', app.processEvents), ('objectName_control', widget.objectName)]
          for name, operation in operations:
              for _ in range(5): operation()
              gc.collect()
              changes = []
              for _ in range(3):
                  before = sys.getrefcount(None)
                  for _ in range(100): operation()
                  after = sys.getrefcount(None)
                  changes.append(after-before)
              print(json.dumps({'python':sys.version.split()[0],'pyside':PySide6.__version__,'operation':name,'None_refcount_deltas_per_100_calls':changes}),flush=True)
          widget.close()
          PY
      - name: Run complete unchanged product test suite
        run: python -m pytest -ra -v
