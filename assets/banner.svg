<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1E38" />
    </linearGradient>

    <!-- Glowing Background Accents -->
    <radialGradient id="blueGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlowBg" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#F5B041" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Halos behind trophies -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9D04B" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#F9D04B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#F9D04B" stop-opacity="0" />
    </radialGradient>

    <!-- Reflective Gold Gradient for Trophies -->
    <linearGradient id="goldReflective" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A640F" />
      <stop offset="15%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#FFF3A8" />
      <stop offset="45%" stop-color="#F9D04B" />
      <stop offset="55%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#8A640F" />
    </linearGradient>
    
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF3A8" />
      <stop offset="100%" stop-color="#8A640F" />
    </linearGradient>

    <!-- Podium Metallic Gradient -->
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&amp;display=swap');
    .font-title {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
    }
    .font-tagline {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 0.15em;
    }
    .font-podium {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
    }
    .font-badge {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="340" fill="url(#blueGlow)" rx="16" />
  <rect width="1200" height="340" fill="url(#goldGlowBg)" rx="16" />
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="url(#goldBorder)" stroke-opacity="0.25" stroke-width="1" />

  <!-- Background Grid Pattern Accent -->
  <g opacity="0.05">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 100,0 L 100,340 M 200,0 L 200,340 M 300,0 L 300,340 M 400,0 L 400,340 M 500,0 L 500,340 M 600,0 L 600,340 M 700,0 L 700,340 M 800,0 L 800,340 M 900,0 L 900,340 M 1000,0 L 1000,340 M 1100,0 L 1100,340" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Halo behind first place trophy -->
  <circle cx="295" cy="150" r="160" fill="url(#haloGlow)" />

  <!-- Sparkles / Magic particles -->
  <!-- Sparkle 1 -->
  <path d="M 130,94 Q 130,100 136,100 Q 130,100 130,106 Q 130,100 124,100 Q 130,100 130,94 Z" fill="url(#goldReflective)" />
  <!-- Sparkle 2 -->
  <path d="M 450,84 Q 450,90 456,90 Q 450,90 450,96 Q 450,90 444,90 Q 450,90 450,84 Z" fill="url(#goldReflective)" opacity="0.8" />
  <!-- Sparkle 3 -->
  <path d="M 260,64 Q 260,70 266,70 Q 260,70 260,76 Q 260,70 254,70 Q 260,70 260,64 Z" fill="#FFFFFF" opacity="0.9" />
  <!-- Sparkle 4 -->
  <path d="M 335,74 Q 335,80 341,80 Q 335,80 335,86 Q 335,80 329,80 Q 335,80 335,74 Z" fill="url(#goldReflective)" opacity="0.7" />
  <!-- Tiny floating particles -->
  <circle cx="295" cy="95" r="3" fill="#FFFFFF" opacity="0.6" />
  <circle cx="280" cy="80" r="2" fill="#FFE066" opacity="0.4" />
  <circle cx="315" cy="85" r="2.5" fill="#FFE066" opacity="0.5" />
  <circle cx="187" cy="125" r="2" fill="#FFFFFF" opacity="0.5" />
  <circle cx="402" cy="155" r="2" fill="#FFFFFF" opacity="0.4" />

  <!-- LEFT GROUP: Podium and Trophies (Inside Safe Zone x:80..1120 y:60..300) -->
  <g>
    <!-- Base Platform -->
    <rect x="120" y="282" width="350" height="12" rx="4" fill="#0F172A" stroke="url(#goldBorder)" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- 2nd Place Podium Block (Left) -->
    <rect x="140" y="230" width="95" height="52" rx="6" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.35" stroke-width="1.5" />
    <text x="187.5" y="265" class="font-podium" font-size="26" fill="url(#goldReflective)" text-anchor="middle" opacity="0.9">2</text>

    <!-- 3rd Place Podium Block (Right) -->
    <rect x="355" y="250" width="95" height="32" rx="6" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.25" stroke-width="1.5" />
    <text x="402.5" y="273" class="font-podium" font-size="20" fill="url(#goldReflective)" text-anchor="middle" opacity="0.8">3</text>

    <!-- 1st Place Podium Block (Center) -->
    <rect x="245" y="210" width="100" height="72" rx="8" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.6" stroke-width="2" />
    <text x="295" y="255" class="font-podium" font-size="36" fill="url(#goldReflective)" text-anchor="middle" font-weight="900">1</text>

    <!-- 2nd Place Trophy (Left, cx=187.5, base y=230) -->
    <g>
      <!-- Base & Pedestal -->
      <rect x="165" y="221" width="45" height="9" rx="2.5" fill="url(#goldReflective)" />
      <path d="M 169,221 L 173,208 L 202,208 L 206,221 Z" fill="url(#goldReflective)" opacity="0.9" />
      <!-- Stem & Collar -->
      <rect x="183" y="186" width="9" height="22" fill="url(#goldReflective)" />
      <rect x="179" y="183" width="17" height="5" rx="1.5" fill="url(#goldReflective)" />
      <!-- Cup Bowl -->
      <path d="M 183,183 C 178,168 161,163 161,145 L 214,145 C 214,163 197,168 192,183 Z" fill="url(#goldReflective)" />
      <rect x="158" y="142" width="59" height="5" rx="2.5" fill="url(#goldReflective)" />
      <!-- Handles -->
      <path d="M 161,149 C 143,149 145,174 166,174 C 163,170 154,170 154,158 C 154,153 158,153 161,153 Z" fill="url(#goldReflective)" />
      <path d="M 214,149 C 232,149 230,174 209,174 C 212,170 221,170 221,158 C 221,153 217,153 214,153 Z" fill="url(#goldReflective)" />
      <!-- Star -->
      <path d="M 187.5,152 L 189.5,158.5 L 196.5,158.5 L 191,162.5 L 193,169.5 L 187.5,165.5 L 182,169.5 L 184,162.5 L 178.5,158.5 L 185.5,158.5 Z" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- 3rd Place Trophy (Right, cx=402.5, base y=250) -->
    <g>
      <!-- Base & Pedestal -->
      <rect x="384" y="242" width="37" height="8" rx="2" fill="url(#goldReflective)" />
      <path d="M 387,242 L 390,231 L 415,231 L 418,242 Z" fill="url(#goldReflective)" opacity="0.8" />
      <!-- Stem & Collar -->
      <rect x="398" y="212" width="9" height="19" fill="url(#goldReflective)" />
      <rect x="394" y="209" width="17" height="4" rx="1.5" fill="url(#goldReflective)" />
      <!-- Cup Bowl -->
      <path d="M 398,209 C 394,196 379,192 379,176 L 426,176 C 426,192 411,196 407,209 Z" fill="url(#goldReflective)" />
      <rect x="376" y="173" width="53" height="4" rx="2" fill="url(#goldReflective)" />
      <!-- Handles -->
      <path d="M 379,179 C 363,179 365,201 384,201 C 381,197 373,197 373,187 C 373,182 377,182 379,182 Z" fill="url(#goldReflective)" />
      <path d="M 426,179 C 442,179 440,201 421,201 C 424,197 432,197 432,187 C 432,182 428,182 426,182 Z" fill="url(#goldReflective)" />
      <!-- Star -->
      <path d="M 402.5,183 L 404,188 L 409.5,188 L 405,191.5 L 406.5,197 L 402.5,193.5 L 398.5,197 L 400,191.5 L 395.5,188 L 401,188 Z" fill="#FFFFFF" opacity="0.7" />
    </g>

    <!-- 1st Place Trophy (Center, cx=295, base y=210) -->
    <g>
      <!-- Base & Pedestal -->
      <rect x="270" y="200" width="50" height="10" rx="3" fill="url(#goldReflective)" />
      <path d="M 275,200 L 280,185 L 310,185 L 315,200 Z" fill="url(#goldReflective)" />
      <!-- Stem & Collar -->
      <rect x="290" y="160" width="10" height="25" fill="url(#goldReflective)" />
      <rect x="286" y="157" width="18" height="6" rx="2" fill="url(#goldReflective)" />
      <!-- Cup Bowl -->
      <path d="M 290,157 C 285,140 265,135 265,115 L 325,115 C 325,135 305,140 300,157 Z" fill="url(#goldReflective)" />
      <rect x="262" y="112" width="66" height="6" rx="3" fill="url(#goldReflective)" />
      <!-- Handles -->
      <path d="M 265,120 C 245,120 247,148 271,148 C 268,143 257,143 257,130 C 257,124 261,124 265,124 Z" fill="url(#goldReflective)" />
      <path d="M 325,120 C 345,120 343,148 319,148 C 322,143 333,143 333,130 C 333,124 329,124 325,124 Z" fill="url(#goldReflective)" />
      <!-- Large Glow Star -->
      <path d="M 295,123 L 298,131 L 306,131 L 300,136 L 302,144 L 295,139 L 288,144 L 290,136 L 284,131 L 292,131 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- RIGHT GROUP: Typography and Badges -->
  <g>
    <!-- Main Wordmark -->
    <text x="530" y="165" class="font-title" font-size="76" fill="#FFFFFF">Profi<tspan fill="url(#goldReflective)">Prompt</tspan><tspan fill="url(#goldReflective)" font-weight="300" opacity="0.85">|</tspan></text>
    
    <!-- Tagline -->
    <text x="535" y="215" class="font-tagline" font-size="23" fill="#94A3B8">YOUR AI PROMPT COLLECTION</text>
    
    <!-- Badges / Pill Tags -->
    <!-- Pill 1: Curated -->
    <g>
      <rect x="535" y="250" width="105" height="30" rx="15" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="552" cy="265" r="3" fill="url(#goldReflective)" />
      <text x="590" y="269" class="font-badge" font-size="12" fill="#FFFFFF" text-anchor="middle">Curated</text>
    </g>
    
    <!-- Pill 2: Optimized -->
    <g>
      <rect x="652" y="250" width="115" height="30" rx="15" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="669" cy="265" r="3" fill="url(#goldReflective)" />
      <text x="712" y="269" class="font-badge" font-size="12" fill="#FFFFFF" text-anchor="middle">Optimized</text>
    </g>
    
    <!-- Pill 3: Ready-to-Use -->
    <g>
      <rect x="779" y="250" width="160" height="30" rx="15" fill="url(#podiumGrad)" stroke="url(#goldBorder)" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="796" cy="265" r="3" fill="url(#goldReflective)" />
      <text x="862" y="269" class="font-badge" font-size="12" fill="#FFFFFF" text-anchor="middle">Ready-to-Use</text>
    </g>
  </g>
</svg>
